<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Door check-in — Beyond The Classroom</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231b2a4a'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23c89b3c' font-family='Georgia,serif'%3EB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="eyebrow">Admin</div>
    <h1>Door check-in</h1>
    <p>Scan a ticket's QR code, or type the code in by hand.</p>
  </header>

  <div id="loginCard" class="card">
    <form id="loginForm">
      <label for="loginEmail">Admin email</label>
      <input type="text" id="loginEmail" required>
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" required>
      <button type="submit" class="btn-primary">Sign in</button>
    </form>
    <div id="loginMessage"></div>
  </div>

  <div id="scanArea" style="display:none;">
    <div class="card">
      <div class="status-row">
        <h2 style="font-size:16px;">Scanner</h2>
        <button id="logoutBtn" class="btn-secondary" style="width:auto;">Sign out</button>
      </div>
      <div id="qrReader" style="border-radius: var(--radius); overflow:hidden;"></div>
      <p class="hint" id="cameraHint">Starting camera…</p>
    </div>

    <div class="card">
      <h2 style="font-size:16px; margin:0 0 6px;">Or enter the code manually</h2>
      <form id="manualForm">
        <input type="text" id="manualCode" placeholder="BTC-XXXXXXXX" style="text-transform:uppercase;">
        <button type="submit" class="btn-primary" style="margin-top:12px;">Check in</button>
      </form>
    </div>

    <div class="card" id="resultCard" style="display:none;">
      <div id="resultBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/checkin.js"></script>
</body>
</html>
